<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Videos — Kedaipal admin</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="icon" href="/videos/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700;800&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/videos/app.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/videos" aria-label="Kedaipal admin"><img src="/videos/logo.svg" alt="Kedaipal" /><span class="brand-sub">Admin</span></a>
    <nav class="top-nav" id="nav" aria-label="Pages" hidden>
      <a href="/videos" data-nav="upload">Videos</a>
      <a href="/videos/recent" data-nav="recent">Recent</a>
    </nav>
    <div class="top-right" id="top-right" hidden>
      <a class="btn btn-ghost btn-sm top-app" id="top-app" href="https://kedaipal.com/app">Kedaipal app</a>
      <div class="menu">
        <button class="user-btn" id="user-btn" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="menu-pop" id="user-menu" hidden></div>
      </div>
    </div>
  </header>

  <!-- One view at a time; app.js picks it. -->
  <main id="view" aria-live="polite">
    <div class="gate"><div class="gate-loading"><span class="spinner" aria-hidden="true"></span>Checking your sign-in…</div></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/videos/config.js"></script>
  <script type="module" src="/videos/app.js"></script>
</body>
</html>
